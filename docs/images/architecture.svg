<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061923"/><stop offset="1" stop-color="#0a2a3a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1400" height="660" rx="34" fill="url(#bg)"/>
<text x="70" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#eefbff">ForgeMind AI System Architecture</text>
<text x="70" y="108" font-family="Arial,sans-serif" font-size="18" fill="#8db4c5">A connected industrial workflow from machine signals to operational action</text>
<style>.box{fill:#0b2635;stroke:#24c7e8;stroke-width:2}.title{font:700 21px Arial;fill:#effcff}.copy{font:15px Arial;fill:#a9cbd8}.arrow{stroke:#39d7a9;stroke-width:4;fill:none;marker-end:url(#m)}</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#39d7a9"/></marker></defs>
<g transform="translate(65,170)"><rect class="box" width="230" height="310" rx="22"/><text class="title" x="28" y="48">Industrial Inputs</text><text class="copy" x="28" y="92">• Sensors & gateways</text><text class="copy" x="28" y="126">• PLC / MQTT / OPC UA</text><text class="copy" x="28" y="160">• Product images</text><text class="copy" x="28" y="194">• Digital twin simulator</text><text class="copy" x="28" y="228">• Operator actions</text></g>
<path class="arrow" d="M310 325 H395"/>
<g transform="translate(410,145)"><rect class="box" width="260" height="360" rx="22"/><text class="title" x="28" y="48">FastAPI Core</text><text class="copy" x="28" y="92">• Authentication & RBAC</text><text class="copy" x="28" y="126">• Machine & factory APIs</text><text class="copy" x="28" y="160">• Data validation</text><text class="copy" x="28" y="194">• Alerts & work orders</text><text class="copy" x="28" y="228">• Reports & audit logs</text><text class="copy" x="28" y="262">• Device command gateway</text><text class="copy" x="28" y="296">• AI assistant orchestration</text></g>
<path class="arrow" d="M685 325 H770"/>
<g transform="translate(785,145)"><rect class="box" width="255" height="360" rx="22"/><text class="title" x="28" y="48">AI & Analytics</text><text class="copy" x="28" y="92">• Failure risk scoring</text><text class="copy" x="28" y="126">• Anomaly detection</text><text class="copy" x="28" y="160">• Health score & RUL</text><text class="copy" x="28" y="194">• Visual defect analysis</text><text class="copy" x="28" y="228">• Golden reference</text><text class="copy" x="28" y="262">• Model registry</text><text class="copy" x="28" y="296">• Explainable recommendations</text></g>
<path class="arrow" d="M1055 325 H1140"/>
<g transform="translate(1155,170)"><rect class="box" width="190" height="310" rx="22"/><text class="title" x="24" y="48">Experience</text><text class="copy" x="24" y="92">• Next.js dashboard</text><text class="copy" x="24" y="126">• Arabic & English</text><text class="copy" x="24" y="160">• Dark / light themes</text><text class="copy" x="24" y="194">• PDF & CSV reports</text><text class="copy" x="24" y="228">• Alerts & decisions</text></g>
<g transform="translate(430,545)"><rect x="0" y="0" width="590" height="70" rx="18" fill="#081f2c" stroke="#2fd3a5" stroke-width="2"/><text x="34" y="30" font-family="Arial" font-size="18" font-weight="700" fill="#eafcff">Data Layer</text><text x="34" y="54" font-family="Arial" font-size="15" fill="#a9cbd8">SQLite for local use · Supabase PostgreSQL ready · local/object storage ready</text></g>
